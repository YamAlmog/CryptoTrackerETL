<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top Coins Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        input, button {
            padding: 0.5rem;
            font-size: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
            background: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 0.75rem;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        img {
            vertical-align: middle;
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>

    <h1>Top Crypto Coins</h1>

    <label for="limit">Number of top coins to fetch:</label>
    <input type="number" id="limit" value="10" min="1">
    <button onclick="fetchTopCoins()">Get Coins</button>

    <table id="coins-table" style="width:100%; border-collapse:collapse;">
        <thead>
            <tr>
                <th>Logo</th>
                <th>Name</th>
                <th>Symbol</th>
                <th>Price</th>
                <th>Market Cap</th>
                <th>Rank</th>
                <th>High 24h</th>
                <th>Low 24h</th>
            </tr>
        </thead>
        <tbody id="coins"></tbody>
    </table>

    <script>
        async function fetchTopCoins() {
            const limit = document.getElementById("limit").value;
            const coinsTbody = document.getElementById("coins");
            coinsTbody.innerHTML = ""; // clear previous results

            try {
                const response = await fetch(`http://localhost:8080/tokens/top_coins/${limit}`);
                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }
                const coins = await response.json();

                coins.forEach(coin => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td><img src="${coin.image}" alt="${coin.name}" width="24" height="24"></td>
                        <td>${coin.name}</td>
                        <td>${coin.symbol.toUpperCase()}</td>
                        <td>$${coin.current_price.toLocaleString()}</td>
                        <td>$${coin.market_cap.toLocaleString()}</td>
                        <td>${coin.market_cap_rank}</td>
                        <td>$${coin.high_24h}</td>
                        <td>$${coin.low_24h}</td>
                    `;
                    coinsTbody.appendChild(row);
                });
            } catch (error) {
                coinsTbody.innerHTML = `<tr><td colspan="8" style="color:red;">Error fetching data: ${error.message}</td></tr>`;
                console.error("Fetch error:", error);
            }
        }
    </script>

</body>
</html>
